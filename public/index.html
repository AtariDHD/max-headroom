<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Max Headroom</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",
          "@pixiv/three-vrm": "/vendor/@pixiv/three-vrm/lib/three-vrm.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="app">
      <header class="header">
        <div class="brand">
          <img src="brand.png" height="40" alt="Max Headroom">
          <!-- <span class="brand-mark">MAX</span>
          <span class="brand-sub">HEADROOM</span> -->
        </div>
        <p class="brand-tag">20 MINUTES INTO THE FUTURE</p>
        <p id="status-pill" class="status-pill" role="status">Connecting…</p>
      </header>

      <section class="stage" aria-label="Max Headroom 3D view">
        <canvas id="max-canvas"></canvas>
        <div id="glitch-flash" class="glitch-flash" hidden></div>
        <div class="movement-debug" aria-label="Movement test controls">
          <div class="movement-debug__panel">
            <span class="movement-debug__hint">TEST</span>
            <label class="sr-only" for="movement-select">Movement</label>
            <select id="movement-select"></select>
            <button type="button" id="movement-play-btn">PLAY</button>
          </div>
        </div>
        <div class="cube-debug" aria-label="Cube corner debug controls">
          <div class="cube-debug__panel">
            <span class="cube-debug__hint">CUBE</span>
            <div class="cube-debug__grid">
              <label>pos X <input id="cube-px" type="number" step="0.01" /></label>
              <label>pos Y <input id="cube-py" type="number" step="0.01" /></label>
              <label>pos Z <input id="cube-pz" type="number" step="0.01" /></label>
              <label>rot X° <input id="cube-rx" type="number" step="0.1" /></label>
              <label>rot Y° <input id="cube-ry" type="number" step="0.1" /></label>
              <label>rot Z° <input id="cube-rz" type="number" step="0.1" /></label>
              <label>scale <input id="cube-scale" type="number" step="0.01" min="0.01" /></label>
              <label>length <input id="cube-size" type="number" step="0.1" min="0.1" /></label>
            </div>
            <button type="button" id="cube-log-btn" class="cube-debug__log">LOG</button>
          </div>
        </div>
      </section>

      <section class="chat-panel" aria-label="Chat with Max">
        <div id="messages" class="messages" role="log" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <div class="chat-input-wrap">
            <button
              type="button"
              id="voice-btn"
              class="voice-btn"
              aria-label="Speak to Max"
              aria-pressed="false"
              title="Speak to Max"
            >
              <svg class="voice-btn__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
                />
              </svg>
            </button>
            <label class="sr-only" for="user-input">Message Max</label>
            <input
              id="user-input"
              type="text"
              autocomplete="off"
              placeholder="Talk to Max…"
              maxlength="500"
            />
          </div>
          <button type="submit" id="send-btn">SEND</button>
        </form>
      </section>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
